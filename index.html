5,w:2.6,h:30},topology:{cabinets:t.topology,bounds:{x:-5,y:3,w:115,h:95},obstacles:[],route:[]},badRoute:t.badRoute,goodRoute:t.goodRoute,solutionData:t.solutionData},{id:4,goal:`Найдите шкаф, к которому приходится подходить с обратной стороны.`,complaint:`К одному стеллажу я захожу с дальней стороны: товар прямо передо мной, а чтобы его взять, надо обойти весь ряд.`,successMessage:`Великолепно! Вы нашли этот коварный шкаф.`,hintText:`Обратите внимание на шкаф, к которому сборщику приходится подходить с обратной стороны, делая крюк.`,hintZone:{x:59,y:21,w:7,h:10},topology:{cabinets:n.topology,bounds:{x:-5,y:3,w:115,h:95},obstacles:[],route:[]},badRoute:n.badRoute,goodRoute:n.goodRoute,solutionData:n.solutionData},{id:5,goal:`Найдите глухие блоки, о которых система не знает.`,complaint:`Система провела меня прямо сквозь стену из шкафов, будто её там нет.`,successMessage:`Отличная работа! Вы правильно определили шкафы, из-за которых сборщику приходится делать крюк.`,hintText:`Маршрут проходит прямо сквозь стену из шкафов. Система не знает, что там стоят глухие блоки — заштрихованные, без розовой грани подхода.`,hintZone:{x:66,y:8,w:7,h:10},topology:{cabinets:e.topology,bounds:{x:-5,y:3,w:115,h:95},obstacles:[],route:[]},badRoute:e.badRoute,goodRoute:e.goodRoute,solutionData:e.solutionData}],s=a(),c=`data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAOMAAAEgCAYAAABGhcTiAADbRklEQVR42uy9d7xkWVnu/33X2ntX1Ymde3pyDj1DDhKEmREElGTgtIooYAAUAwYUBDx9DFf5ebnBa7qKARUv9kFBEQQRZhoEyUOYaRgmMHmmc59YVXvvtd7fH2vtUGeGK1yJ3bX6U5/Tp06FXbvWs9/0vM8L4/XVXfvmLMD5737R7KOu//kXPOGTv3AeAKoyPjnj1V5mfAq+SksRFGHPorts/4uf3Zk2HxqK+/P7jhz/lvCAPf/xudd5M6f77LzOj7+nU2Al41PwVQLi3nlhYcFfdu2Lf6uw/hWJWNbuWTqxvNL/KAB7d+sXff78vGEvIAt+cXw2x2u8/t+BOBdd08uuffFfXPjhn9Bz3/OC9d3//hJ3/r88/701WL/ImtPwXIDHferllzzplle/8gmf/IUfBRhbyLFlHK8vY1157bxd3LNQXvbeF/9a3pXnF8tr/U6WgTUG9LoIOQOLbsNThX1zZlEW3ZNufMX5y+uDeafldy0ZO3P03kOvBVhYPDCOM8dgHK8vae2bs/uvXigv/pcf/6F1LV/jVsqhiEmMwRdlgYj9FACLX8St3bPgvuW6n3/BweMrv+MTtuGVQ5+4+8NH/su+1zCPYc+
